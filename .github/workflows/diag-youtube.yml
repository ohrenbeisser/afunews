name: Diagnose YouTube (temporär)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Varianten testen
        run: |
          CH=UCPRdlnpaE9HA5sM3ffvnK7Q
          PL=UUPRdlnpaE9HA5sM3ffvnK7Q
          UA_BROWSER="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          t() { printf '%-40s ' "$1"; shift; curl -s -o /tmp/o -w '%{http_code} %{size_download}B %{time_total}s\n' --max-time 25 "$@"; head -c 160 /tmp/o | tr '\n' ' '; echo; }
          t "channel_id, UA afunews"          -A "afunews-feedreader/1.0" "https://www.youtube.com/feeds/videos.xml?channel_id=$CH"
          t "channel_id, UA python-urllib"    -A "Python-urllib/3.12" "https://www.youtube.com/feeds/videos.xml?channel_id=$CH"
          t "channel_id, UA Browser"          -A "$UA_BROWSER" "https://www.youtube.com/feeds/videos.xml?channel_id=$CH"
          t "channel_id, Browser, IPv4"       -4 -A "$UA_BROWSER" "https://www.youtube.com/feeds/videos.xml?channel_id=$CH"
          t "playlist_id Uploads, Browser"    -A "$UA_BROWSER" "https://www.youtube.com/feeds/videos.xml?playlist_id=$PL"
          t "ohne www, Browser, Redirect"     -L -A "$UA_BROWSER" "https://youtube.com/feeds/videos.xml?channel_id=$CH"
          t "Kanalseite, Browser"             -L -A "$UA_BROWSER" "https://www.youtube.com/channel/$CH"
          sleep 20
          t "channel_id nach 20 s, Browser"   -A "$UA_BROWSER" "https://www.youtube.com/feeds/videos.xml?channel_id=$CH"
