name: YouTube-Feeds abrufen

# Läuft sonntags vor dem Wochen-Agenten und legt data/youtube.json ab.
# 03:30 UTC = 04:30 MEZ bzw. 05:30 MESZ.
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-feeds
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feeds abrufen
        run: python3 scripts/youtube_feeds.py --tage 8

      - name: Prüfung
        run: python3 scripts/pruefen.py

      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git commit -m "YouTube-Feeds vom $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
