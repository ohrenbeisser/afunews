name: YouTube-Feeds abrufen

# Läuft sonntags vor dem Wochen-Agenten, führt scripts/afu-youtube.php
# mit der PHP-CLI auf dem Runner aus und legt data/youtube.json ab.
# Die Kanalliste (afu-youtube-canel.json) kommt von ohrenbeisser.de.
# GitHub verzögert geplante Läufe zu Stoßzeiten (volle und halbe Stunden)
# um Stunden oder lässt sie ausfallen. Darum zwei Termine zu ungeraden
# Minuten, früh am Sonntag (UTC): 01:07 und als Ersatz 02:37. Der Ersatz
# tut nichts, wenn data/youtube.json von heute schon da ist.
on:
  schedule:
    - cron: "7 1 * * 0"
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-feeds
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen, ob heute schon abgerufen wurde
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          heute = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          fertig = False
          try:
              stand = json.load(open("data/youtube.json", encoding="utf-8"))["Statistik"]["Stand"]
              tag = datetime.datetime.fromisoformat(stand).astimezone(datetime.timezone.utc).strftime("%Y-%m-%d")
              fertig = tag == heute
          except Exception:
              pass
          # Nur der Ersatztermin (schedule) überspringt; ein manueller Start läuft immer.
          print("skip=" + ("true" if fertig else "false"))
          PY
        if: github.event_name == 'schedule'

      - name: YouTube-Liste erzeugen (afu-youtube.php)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -u
          tmp="$(mktemp -d)"
          cp scripts/afu-youtube.php "$tmp/"
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -o "$tmp/afu-youtube-canel.json" \
            https://ohrenbeisser.de/tools/afu/afu-youtube-canel.json
          cp "$tmp/afu-youtube-canel.json" data/youtube-kanaele.json
          # Letzten Stand mitgeben: Das Skript übernimmt daraus die Videos
          # von Kanälen, die gerade nicht erreichbar sind.
          if [ -f data/youtube.json ]; then cp data/youtube.json "$tmp/afu-youtube.json"; fi
          vorher="$(stat -c %y "$tmp/afu-youtube.json" 2>/dev/null || echo keine)"
          status=0
          php "$tmp/afu-youtube.php" || status=$?
          nachher="$(stat -c %y "$tmp/afu-youtube.json" 2>/dev/null || echo keine)"
          if [ "$nachher" = "keine" ] || [ "$nachher" = "$vorher" ]; then
            echo "::error::afu-youtube.php hat keine Ergebnisdatei geschrieben (Rückgabe $status)"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Mindestens ein Kanal war nicht erreichbar, letzter Stand übernommen"
          fi
          cp "$tmp/afu-youtube.json" data/youtube.json

      - name: Prüfung
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/pruefen.py

      - name: Committen und pushen
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git add data/youtube-kanaele.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git commit -m "YouTube-Feeds vom $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
